<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AD Agent</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* 팀 열람(휴대폰): 위 바(광고주 선택) / 가운데 화면 / 아래 탭(분석·지도·리포트). 비밀번호로 열림. 콘텐츠큐브 업소는 번호·흐린 위치 */
:root{--bg:#f1f3f6;--panel:#fff;--line:#e1e4e9;--fg:#1b2230;--muted:#667085;--bar:#1c2c52;--accent:#1f4fd1;--accent-soft:#e8eefc;--rest:#c9d1de;
  --hotel:#0f7b8a;--comic:#d4880f;--etc:#7a8394;--f:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f)}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--m);font-variant-numeric:tabular-nums}
#lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#lock form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px;width:min(360px,100%);display:flex;flex-direction:column;gap:14px}
#lock h1{margin:0;font-size:20px}
#lock p{margin:0;color:var(--muted);font-size:14px}
#lock input{padding:12px;border:1px solid var(--line);border-radius:10px;font-size:17px}
#lock button{padding:12px;border:0;border-radius:10px;background:var(--bar);color:#fff;font-weight:600;font-size:16px}
#lock .err{color:#b42318;font-size:14px}
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}
.top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.top b{font-size:24px;letter-spacing:-.02em;line-height:1.1}
.top small{display:block;font-size:11px;color:#b9c4dc;font-weight:400}
.top label{margin-left:auto;display:flex;align-items:center;gap:5px;color:#fff;font-weight:600}
.top label svg{width:17px;height:17px;flex-shrink:0}
.top select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#fff;font-weight:600;font-size:15px;max-width:40vw;padding:4px 0}
.top select option{color:#1b2230}
main{flex:1;min-height:0;overflow:auto;position:relative}
.view{display:none}
.view.on{display:block}
#vMap.on{display:flex;flex-direction:column;height:100%}
.pad{padding:14px max(14px,env(safe-area-inset-right,0px)) 24px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
h2{margin:0;font-size:19px;line-height:1.35;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpis div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpis span{display:block;font-size:12px;color:var(--muted)}
.kpis b{font-size:22px;font-family:var(--m)}
.kpis b.hero{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h3{margin:0 0 8px;font-size:14px}
.bars{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;align-items:end;height:110px;border-bottom:1px solid var(--line)}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;font-size:10px}
.bars i{display:block;width:100%;background:var(--rest);border-radius:3px 3px 0 0}
.bars .in i{background:var(--accent)}
.axis{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;font-size:9px;color:var(--muted);text-align:center;margin-top:4px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .r{margin-left:auto;text-align:right}
.row small{color:var(--muted);font-size:12px}
.go{cursor:pointer}
.tier{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.tier:first-of-type{border-top:0}
.tier small{color:var(--muted);font-size:12px}
.tier b.n{grid-row:1/3;grid-column:2;align-self:center;font-size:20px;font-family:var(--m)}
#map{flex:1;min-height:0}
.search{position:absolute;z-index:500;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:10px}
.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.results{background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:6px;max-height:40vh;overflow:auto}
.results div{padding:10px 12px;border-top:1px solid var(--line)}
.results div:first-child{border-top:0}
.sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:8px 14px 12px;max-height:46%;overflow:auto;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
.sheet .grip{width:36px;height:4px;border-radius:2px;background:#d0d5dd;margin:0 auto 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips span{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.designs{display:flex;gap:6px}
.designs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-weight:600}
.designs button[aria-pressed="true"]{background:var(--bar);border-color:var(--bar);color:#fff}
.pgwrap{overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.15);margin:0 auto}
.pg{width:794px;height:1123px;transform-origin:top left;background:#fff}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bar);padding:7px 10px calc(7px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:none;border-radius:8px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#b9c4dc;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-pressed="true"]{background:#fff;color:var(--bar);font-weight:700}
.brandpin{width:16px;height:16px;background:#c8102e;border:3px solid #fff;transform:rotate(45deg);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.foot{font-size:11px;color:var(--muted);text-align:center;padding:4px 0 10px}
</style>
</head>
<body>
<div id="lock">
  <form id="lf" autocomplete="off">
    <h1>AD Agent</h1>
    <p>팀 열람 비밀번호를 넣어 주세요.</p>
    <input id="pw" type="password" aria-label="팀 열람 비밀번호" autocomplete="current-password">
    <p class="err" id="lerr" hidden></p>
    <button type="submit">열기</button>
  </form>
</div>
<div id="app">
  <div class="top"><div><b>AD Agent</b><small id="asof"></small></div><label><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 6.5h12M2.5 6.5V14h11V6.5M1.8 6.5 3 2.5h10l1.2 4"/><path d="M6.5 14v-4h3v4"/></svg><select id="client" aria-label="광고주"></select><svg viewBox="0 0 16 16" fill="none" stroke="#b9c4dc" stroke-width="1.8" aria-hidden="true" style="width:13px;height:13px"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></label></div>
  <main>
    <section class="view on" id="vHome"></section>
    <section class="view" id="vMap"><div style="position:relative;flex:1;min-height:0;display:flex"><div id="map"></div>
      <div class="search"><input id="q" type="search" placeholder="매장명·주소 검색"><div class="results" id="res" hidden></div></div></div>
      <div class="sheet" id="sheet"></div></section>
    <section class="view" id="vRep"></section>
  </main>
  <nav class="tabs" aria-label="화면">
    <button data-v="vHome" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5.5" height="6" rx="1"/><rect x="9" y="1.5" width="5.5" height="3.5" rx="1"/><rect x="1.5" y="9.5" width="5.5" height="5" rx="1"/><rect x="9" y="7" width="5.5" height="7.5" rx="1"/></svg>분석</button>
    <button data-v="vMap" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="7" r="2.2"/><path d="M8 14.5s-5-4.6-5-8a5 5 0 0 1 10 0c0 3.4-5 8-5 8z"/></svg>지도</button>
    <button data-v="vRep" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.5h5.5L13 5v9.5H4z"/><path d="M9.5 1.5V5H13M6 8.5h5M6 11h5"/></svg>리포트</button>
  </nav>
</div>
<script>
// 광고주 리포트 숫자 계산. 브라우저(window.computeReport)와 node(require) 모두에서 쓴다.
// media  M: 0 lat 1 lng 2 상호 3 유형 4 대리점 5 요금제 6 월Fee 7 만료일 8 주소 9 시도 10 스크린수 11 CCID
// client C: {name, stores:[[lat,lng,매장명,형태,전화,주소]]}
(function (root) {
  const BANDS = [['같은 건물', 30], ['~100m', 100], ['~300m', 300], ['~500m', 500], ['~1km', 1000],
                 ['~2km', 2000], ['~3km', 3000], ['~5km', 5000], ['5km 초과', Infinity]];
  // 시도 표기는 짧게 (시안과 같은 이름)
  const SIDO = {'서울특별시':'서울','부산광역시':'부산','대구광역시':'대구','인천광역시':'인천','광주광역시':'전남광주','대전광역시':'대전',
    '울산광역시':'울산','세종특별자치시':'세종','경기도':'경기','강원특별자치도':'강원','강원도':'강원','충청북도':'충북','충청남도':'충남',
    '전북특별자치도':'전북','전라북도':'전북','전라남도':'전남광주','전남':'전남광주','광주':'전남광주','전남광주통합특별시':'전남광주',
    '경상북도':'경북','경상남도':'경남','제주특별자치도':'제주'};
  const sidoOf = s => SIDO[s] || s;

  function dist(a, b, c, d) { const x = (d - b) * Math.cos((a + c) * Math.PI / 360) * 111320, y = (c - a) * 110574; return Math.hypot(x, y); }
  const deliveryMin = d => 20 + Math.max(d * 1.35 / 1000 / 20 * 60, 2);   // 조리15 + 전달5 + 오토바이 20km/h
  const pct = (a, b) => b ? (a / b * 100).toFixed(1) : '0.0';
  const median = arr => { if (!arr.length) return 0; const s = [...arr].sort((a, b) => a - b); return Math.round(s[s.length >> 1]); };

  function nearestIndex(stores) {
    const g = new Map();
    stores.forEach((r, i) => { const k = Math.floor(r[0] / .05) + ',' + Math.floor(r[1] / .05); (g.get(k) || g.set(k, []).get(k)).push(i); });
    return (lat, lng) => {
      const cy = Math.floor(lat / .05), cx = Math.floor(lng / .05);
      for (let n = 1; n <= 40; n += n) {            // 가까운 칸부터 넓혀 찾기
        let best = { i: -1, d: Infinity };
        for (let y = cy - n; y <= cy + n; y++) for (let x = cx - n; x <= cx + n; x++)
          for (const i of g.get(y + ',' + x) || []) { const d = dist(lat, lng, stores[i][0], stores[i][1]); if (d < best.d) best = { i, d }; }
        if (best.i >= 0 && best.d <= n * 4000) return best;
      }
      let best = { i: -1, d: Infinity };
      stores.forEach((s, i) => { const d = dist(lat, lng, s[0], s[1]); if (d < best.d) best = { i, d }; });
      return best;
    };
  }

  function computeReport(C, M, asOf, opts = {}) {
    const near = nearestIndex(C.stores);
    const rows = M.map(m => { const n = near(m[0], m[1]); return { m, i: n.i, d: n.d, min: deliveryMin(n.d), sido: sidoOf(m[9]), tv: m[10] }; });
    const total = rows.length, tvTotal = rows.reduce((a, r) => a + r.tv, 0);
    const in1 = rows.filter(r => r.d <= 1000), in500 = rows.filter(r => r.d <= 500);
    const tv1 = in1.reduce((a, r) => a + r.tv, 0);

    let cum = 0;
    const bands = BANDS.map(([label, max], k) => {
      const n = rows.filter(r => r.d <= max && (k === 0 || r.d > BANDS[k - 1][1])).length; cum += n;
      return { label, n, pct: pct(n, total), cum: pct(cum, total), inside1km: max <= 1000 };
    });

    const byType = t => rows.filter(r => r.m[3] === t);
    const hotel = byType('호텔'), comic = byType('만화카페');

    const sidoMap = new Map();
    rows.forEach(r => { const s = sidoMap.get(r.sido) || sidoMap.set(r.sido, { name: r.sido, rows: [] }).get(r.sido); s.rows.push(r); });
    const sido = [...sidoMap.values()].map(s => {
      const w1 = s.rows.filter(r => r.d <= 1000);
      return { name: s.name, n: s.rows.length, w500: s.rows.filter(r => r.d <= 500).length, w1: w1.length,
               pct: pct(w1.length, s.rows.length), pctNum: w1.length / s.rows.length * 100,
               tv1: w1.reduce((a, r) => a + r.tv, 0), median: median(s.rows.map(r => r.d)) };
    }).sort((a, b) => b.n - a.n);

    // 광고주 매장별: 최근접으로 짝지어진 1km 이내 매체
    const per = new Map();
    in1.forEach(r => { const p = per.get(r.i) || per.set(r.i, []).get(r.i); p.push(r); });
    const stores = [...per.entries()].map(([i, rs]) => {
      const s = C.stores[i];
      return { name: s[2], type: s[3] || '', sido: sidoOf((s[5] || '').split(' ')[0]), n: rs.length,
               tv: rs.reduce((a, r) => a + r.tv, 0), median: median(rs.map(r => r.d)) };
    }).sort((a, b) => b.n - a.n || b.tv - a.tv);
    const top = stores.slice(0, 10).map((s, k) => ({ rank: String(k + 1).padStart(2, '0'), ...s }));

    const tierDef = [['T1', '핵심 거점', '10곳 이상', 10, Infinity], ['T2', '확장 거점', '5~9곳', 5, 9], ['T3', '커버리지', '1~4곳', 1, 4]];
    const tiers = tierDef.map(([key, name, range, lo, hi]) => {
      const ss = stores.filter(s => s.n >= lo && s.n <= hi), tv = ss.reduce((a, s) => a + s.tv, 0);
      return { key, name, range, stores: ss.length, media: ss.reduce((a, s) => a + s.n, 0), tv, tvPct: pct(tv, tv1) };
    });
    const t12stores = tiers[0].stores + tiers[1].stores, t12tv = tiers[0].tv + tiers[1].tv;

    const d = (asOf || '').slice(0, 10).split('-');
    const avgMin = rows.reduce((a, r) => a + r.min, 0) / (total || 1);
    return {
      brand: C.name, media: '콘텐츠큐브', mediaEn: 'CONTENTSCUBE',
      date: `${d[0]}. ${d[1]}. ${d[2]}`, dateDot: `${d[0]}.${d[1]}.${d[2]}`, ym: `${d[0]}.${d[1]}`,
      nMedia: total, nBrand: C.stores.length,
      w1: { n: in1.length, pct: pct(in1.length, total) }, w500: { n: in500.length, pct: pct(in500.length, total) },
      same: { n: bands[0].n },
      tv: { total: tvTotal, w1: tv1, w1pct: pct(tv1, tvTotal) },
      avgMin: avgMin.toFixed(1),
      pct25: pct(rows.filter(r => r.min <= 25).length, total), pct30: pct(rows.filter(r => r.min <= 30).length, total),
      matched: stores.length,
      bands, bandMax: Math.max(...bands.map(b => b.n)),
      hotel: { n: hotel.length, avgTv: Math.round(hotel.reduce((a, r) => a + r.tv, 0) / (hotel.length || 1)), w1pct: pct(hotel.filter(r => r.d <= 1000).length, hotel.length) },
      comic: { n: comic.length, w1pct: pct(comic.filter(r => r.d <= 1000).length, comic.length) },
      sido, sidoTotal: { n: total, w500: in500.length, w1: in1.length, pct: pct(in1.length, total), tv1 },
      sidoAboveAvg: sido.filter(s => s.pctNum >= in1.length / total * 100).length,
      top, tiers, tier12: { stores: t12stores, storesPct: pct(t12stores, stores.length), tvPct: pct(t12tv, tv1) },
      contact: { org: '엑세스(콘텐츠큐브) 광고사업본부', line: '박철순 이사 · 010-3233-1555' },
      // 팀용 내부 상세(업장 상호·대리점·요금). 광고주용 문서에는 쓰지 않는다.
      detail: opts.detail ? [...per.entries()].map(([i, rs]) => ({ store: C.stores[i][2], addr: C.stores[i][5],
        media: rs.sort((a, b) => a.d - b.d).map(r => ({ name: r.m[2], type: r.m[3], d: Math.round(r.d), tv: r.tv, agency: r.m[4], fee: r.m[6], exp: r.m[7] })) }))
        .sort((a, b) => b.media.length - a.media.length) : undefined,
    };
  }

  const api = { computeReport, sidoOf };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else Object.assign(root, api);
})(typeof window !== 'undefined' ? window : globalThis);

;
// 디자인 A · 에디토리얼 (mockup/A1~A4.inner.html → 데이터 템플릿)
(function () {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const num = x => Number(x).toLocaleString('ko-KR');

  // 받침 여부 (한글 · 영문 대문자 · 숫자의 한국어 읽기 기준)
  function hasBatchim(word) {
    const c = String(word).trim().slice(-1);
    const code = c.charCodeAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) return (code - 0xAC00) % 28 !== 0;
    if (/[LMNRlmnr]/.test(c)) return true;          // 엘 엠 엔 알
    if (/[013678]/.test(c)) return true;            // 영 일 삼 육 칠 팔
    return false;
  }
  const josa = (w, withB, without) => w + (hasBatchim(w) ? withB : without);

  // 49,244 → '4만 9천'
  function approx(n) {
    const k = Math.floor(n / 1000), man = Math.floor(k / 10), cheon = k % 10;
    return (man ? man + '만' : '') + (man && cheon ? ' ' : '') + (cheon ? cheon + '천' : '');
  }
  const cumText = c => (c === '100.0' ? '100' : c) + '%';

  const PAGE = "width: 794px; height: 1123px; box-sizing: border-box; overflow: hidden; background: #FFFFFF; color: #1C1B1A; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column;";
  const SERIF = "font-family: 'Noto Serif KR', serif;";

  function runHead(R, no) {
    return `<div style="display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #1C1B1A; font-size: 12px; color: #5E5B57;">
    <span>${esc(R.brand)} × ${esc(R.media)} 배달 상권 매칭 분석</span>
    <span style="font-weight: 700; color: #1C1B1A;">${no}</span>
  </div>`;
  }

  // ───────── 1쪽 표지
  function cover(R) {
    const B = esc(R.brand), M = esc(R.media);
    return `<div style="${PAGE} padding: 56px 64px 48px;">

  <div style="display: flex; justify-content: space-between; padding-top: 8px; font-size: 12px; color: #5E5B57;">

    <span>Vol. 01</span>
  </div>

  <div style="margin-top: 120px; display: flex; flex-direction: column; gap: 22px;">

    <p style="margin: 0; max-width: 560px; font-size: 17px; line-height: 1.65; color: #3A3835; text-wrap: pretty;">전국 ${M} 활성 매장 ${num(R.nMedia)}곳과 ${B} 매장 ${num(R.nBrand)}곳을 직선거리·도로거리·예상 배달시간으로 하나씩 짝지었습니다. 객실 TV가 켜지는 곳과 ${esc(josa(R.brand, '이', '가'))} 배달하는 곳이 얼마나 겹치는지를 보여 드립니다.</p>
  </div>

  <div style="margin-top: auto; display: flex; align-items: flex-end; gap: 28px; padding-bottom: 36px; border-bottom: 1px solid #1C1B1A;">

  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; padding-top: 20px; font-size: 12px; line-height: 1.6;">
    <div style="display: flex; flex-direction: column; gap: 4px;"><span style="color: #5E5B57;">기준일</span><b style="font-size: 14px;">${esc(R.date)}</b></div>
    <div style="display: flex; flex-direction: column; gap: 4px;"><span style="color: #5E5B57;">분석 대상</span><b style="font-size: 14px;">${M} ${num(R.nMedia)}곳<br>${B} ${num(R.nBrand)}곳</b></div>

</div>`;
  }

  // ───────── 2쪽 핵심 요약
  function summary(R) {
    const B = esc(R.brand), M = esc(R.media);
    const w500num = parseFloat(R.w500.pct);
    const BAR_MAX = 170;   // 시안에서 가장 큰 막대 높이
    const lastIn = R.bands.reduce((k, b, i) => (b.inside1km ? i : k), -1);
    const bars = R.bands.map(b => {
      const h = b.n > 0 ? Math.max(2, Math.round(b.n / (R.bandMax || 1) * BAR_MAX)) : 0;
      return `<div style="display: flex; flex-direction: column; align-items: center; gap: 4px;"><span style="font-size: 12px; font-weight: 700;">${num(b.n)}</span><div style="width: 100%; height: ${h}px; background: ${b.inside1km ? '#A4161A' : '#C9C6C1'};"></div></div>`;
    }).join('\n    ');
    const labels = R.bands.map(b => `<span>${esc(b.label)}</span>`).join('');
    const cums = R.bands.map((b, i) => i === lastIn ? `<b style="color: #A4161A;">${cumText(b.cum)}</b>` : `<span>${cumText(b.cum)}</span>`).join('');
    const halfLine = w500num >= 50 ? '절반이 넘는 매장이 500m 안에 있고' : `${esc(R.w500.pct)}%가 500m 안에 있고`;
    const halfTitle = w500num >= 50 ? '절반 이상이 걸어서 닿는 거리' : '걸어서 닿는 거리';

    return `<div style="${PAGE} padding: 48px 64px 44px;">
  ${runHead(R, '02')}

  <div style="margin-top: 36px; font-size: 13px; font-weight: 700; color: #A4161A; letter-spacing: 0.1em;">01 · 핵심 요약</div>
  <h2 style="margin: 12px 0 0; ${SERIF} font-weight: 900; font-size: 34px; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance;">${M} 매장 10곳 중 ${Math.round(parseFloat(R.w1.pct) / 10)}곳이<br>${B} 매장 1km 안에 있습니다</h2>
  <p style="margin: 14px 0 0; font-size: 15px; line-height: 1.7; color: #3A3835; text-wrap: pretty;">매장마다 가장 가까운 ${B} 매장 1곳을 찾아 거리를 쟀습니다. ${halfLine}, 1km 안으로 넓히면 ${esc(R.w1.pct)}%가 들어옵니다. 이 매장들의 객실 TV는 ${approx(R.tv.w1)} 대가 넘습니다.</p>

  <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid #1C1B1A; border-bottom: 1px solid #1C1B1A;">
    <div style="padding: 16px 14px 16px 0; display: flex; flex-direction: column; gap: 6px;">
      <span style="${SERIF} font-weight: 900; font-size: 38px; line-height: 1; color: #A4161A;">${esc(R.w1.pct)}%</span>
      <span style="font-size: 13px; font-weight: 700;">${B} 1km 이내 매장</span>
      <span style="font-size: 12px; color: #5E5B57;">${num(R.w1.n)}곳 / ${num(R.nMedia)}곳</span>
    </div>
    <div style="padding: 16px 14px; border-left: 1px solid #D8D5D0; display: flex; flex-direction: column; gap: 6px;">
      <span style="${SERIF} font-weight: 900; font-size: 38px; line-height: 1;">${num(R.tv.w1)}</span>
      <span style="font-size: 13px; font-weight: 700;">1km 이내 설치 TV(대)</span>
      <span style="font-size: 12px; color: #5E5B57;">전체 ${num(R.tv.total)}대의 ${esc(R.tv.w1pct)}%</span>
    </div>
    <div style="padding: 16px 14px; border-left: 1px solid #D8D5D0; display: flex; flex-direction: column; gap: 6px;">
      <span style="${SERIF} font-weight: 900; font-size: 38px; line-height: 1;">${esc(R.avgMin)}분</span>
      <span style="font-size: 13px; font-weight: 700;">평균 예상 배달 소요</span>
      <span style="font-size: 12px; color: #5E5B57;">조리 15분 포함 추정</span>
    </div>
    <div style="padding: 16px 0 16px 14px; border-left: 1px solid #D8D5D0; display: flex; flex-direction: column; gap: 6px;">
      <span style="${SERIF} font-weight: 900; font-size: 38px; line-height: 1;">${num(R.matched)}곳</span>
      <span style="font-size: 13px; font-weight: 700;">매칭된 ${B} 매장</span>
      <span style="font-size: 12px; color: #5E5B57;">1km 내 업장 1곳 이상</span>
    </div>
  </div>

  <div style="margin-top: 30px; display: flex; justify-content: space-between; align-items: baseline;">
    <span style="font-size: 14px; font-weight: 700;">${B} 매장까지 거리별 ${M} 매장 수</span>
    <span style="font-size: 12px; color: #5E5B57;">단위: 곳 · 아래 줄은 누적 비중</span>
  </div>
  <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(${R.bands.length}, minmax(0, 1fr)); gap: 10px; align-items: end; height: 200px; border-bottom: 1px solid #1C1B1A;">
    ${bars}
  </div>
  <div style="display: grid; grid-template-columns: repeat(${R.bands.length}, minmax(0, 1fr)); gap: 10px; padding-top: 8px; font-size: 12px; text-align: center;">
    ${labels}
  </div>
  <div style="display: grid; grid-template-columns: repeat(${R.bands.length}, minmax(0, 1fr)); gap: 10px; padding-top: 4px; font-size: 12px; text-align: center; color: #5E5B57;">
    ${cums}
  </div>

  <div style="margin-top: 30px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #1C1B1A; padding-top: 12px;">
      <span style="${SERIF} font-weight: 900; font-size: 22px; color: #A4161A;">1</span>
      <b style="font-size: 14px;">${halfTitle}</b>
      <span style="font-size: 13px; line-height: 1.65; color: #3A3835;">${esc(R.w500.pct)}%(${num(R.w500.n)}곳)가 500m 이내에 있습니다. ${B} 매장과 같은 건물에 있는 곳도 ${num(R.same.n)}곳입니다.</span>

    </div>
  </div>

  <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid #D8D5D0; font-size: 12px; line-height: 1.6; color: #5E5B57;">1km 이내 집계(${num(R.w1.n)}곳)는 직선거리 기준입니다. 설치 TV는 요금제상 계약 대수입니다.</div>
</div>`;
  }

  // ───────── 3쪽 상권 상세
  function detail(R) {
    const B = esc(R.brand), M = esc(R.media);
    const COLS1 = 'grid-template-columns: 82px 56px 64px 64px minmax(0, 1fr) 76px 70px; column-gap: 10px;';
    const COLS2 = 'grid-template-columns: 28px minmax(0, 1fr) 76px 92px 70px 70px 76px; column-gap: 10px;';

    // 제목: 매장 10곳 이상 시도 중 1km 비중 1·2위
    const big = R.sido.filter(s => s.n >= 10).slice().sort((a, b) => b.pctNum - a.pctNum);
    const [s1, s2] = big;
    const title = s1 && s2
      ? `${esc(josa(s1.name, '은', '는'))} ${esc(s1.pct)}%, ${esc(josa(s2.name, '은', '는'))} ${esc(s2.pct)}%가 1km 안입니다`
      : `${esc(R.w1.pct)}%가 1km 안입니다`;

    const rows = R.sido.map(r => {
      const c = r.pctNum >= 90 ? '#A4161A' : '#1C1B1A';
      return `<div style="display: grid; ${COLS1} align-items: center; height: 23px; border-bottom: 1px solid #E6E3DE; font-size: 12.5px; font-variant-numeric: tabular-nums;">
      <span style="font-weight: 500;">${esc(r.name)}</span>
      <span style="text-align: right;">${num(r.n)}</span>
      <span style="text-align: right;">${num(r.w500)}</span>
      <span style="text-align: right;">${num(r.w1)}</span>
      <span style="display: flex; align-items: center; gap: 8px;"><span style="display: block; height: 6px; width: ${Math.round(r.pctNum * 0.85)}px; background: ${c};"></span><b style="color: ${c};">${esc(r.pct)}%</b></span>

      <span style="text-align: right; color: #5E5B57;">${num(r.median)}m</span>

    const hubs = R.top.map(h => `<div style="display: grid; ${COLS2} align-items: center; height: 24px; border-bottom: 1px solid #E6E3DE; font-size: 12.5px; font-variant-numeric: tabular-nums;">
      <span style="${SERIF} font-weight: 900; color: #A4161A;">${esc(h.rank)}</span>
      <span style="font-weight: 500;">${esc(h.name)}</span>
      <span>${esc(h.sido)}</span>
      <span style="color: #5E5B57;">${esc(h.type)}</span>
      <span style="text-align: right; font-weight: 700;">${num(h.n)}</span>
      <span style="text-align: right;">${num(h.tv)}</span>
      <span style="text-align: right; color: #5E5B57;">${num(h.median)}m</span>
    </div>`).join('\n  ');

    const T = R.sidoTotal;
    return `<div style="${PAGE} padding: 48px 64px 44px;">
  ${runHead(R, '03')}

  <div style="margin-top: 30px; font-size: 13px; font-weight: 700; color: #A4161A; letter-spacing: 0.1em;">02 · 상권 상세</div>

  <div style="margin-top: 20px; display: grid; ${COLS1} padding: 8px 0; border-top: 2px solid #1C1B1A; border-bottom: 1px solid #1C1B1A; font-size: 12px; font-weight: 700;">
    <span>시도</span><span style="text-align: right;">매장</span><span style="text-align: right;">500m 이내</span><span style="text-align: right;">1km 이내</span><span>1km 비중</span><span style="text-align: right;">1km 내 TV</span><span style="text-align: right;">거리 중앙값</span>
  </div>

  </div>

  <h3 style="margin: 30px 0 0; ${SERIF} font-weight: 900; font-size: 20px; letter-spacing: -0.01em;">1km 안에 업장이 가장 많이 모인 ${B} 매장 ${R.top.length}곳</h3>
  <div style="margin-top: 12px; display: grid; ${COLS2} padding: 8px 0; border-top: 2px solid #1C1B1A; border-bottom: 1px solid #1C1B1A; font-size: 12px; font-weight: 700;">
    <span>#</span><span>${B} 매장</span><span>지역</span><span>매장형태</span><span style="text-align: right;">업장 수</span><span style="text-align: right;">설치 TV</span><span style="text-align: right;">거리 중앙값</span>
  </div>
  ${hubs}

  <div style="margin-top: auto; padding-top: 10px; border-top: 1px solid #D8D5D0; font-size: 12px; line-height: 1.6; color: #5E5B57;">업장 수는 해당 ${B} 매장이 최근접 매장으로 매칭된 1km 이내 ${M} 업장 수입니다. 거리는 직선거리, 전남광주는 전남광주통합특별시입니다.</div>
</div>`;
  }

  // ───────── 4쪽 제안
  function proposal(R) {
    const B = esc(R.brand), M = esc(R.media);
    const STYLE = [
      { top: '#A4161A', label: ' color: #A4161A;' },
      { top: '#1C1B1A', label: '' },
      { top: '#C9C6C1', label: ' color: #5E5B57;' },
    ];
    const tiers = R.tiers.map((t, i) => {
      const s = STYLE[i] || STYLE[STYLE.length - 1];
      return `<div style="display: flex; flex-direction: column; gap: 10px; border-top: 4px solid ${s.top}; padding-top: 14px;">
      <span style="font-size: 12px; font-weight: 700;${s.label} letter-spacing: 0.08em;">TIER ${i + 1} · ${esc(t.name)}</span>
      <span style="font-size: 13px; color: #5E5B57;">1km 내 업장 ${esc(t.range)}</span>
      <span style="${SERIF} font-weight: 900; font-size: 40px; line-height: 1;">${num(t.stores)}<span style="font-size: 16px; font-family: 'Noto Sans KR', sans-serif; font-weight: 700;"> 개 매장</span></span>
      <div style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; border-top: 1px solid #E6E3DE; padding-top: 10px;"><span>업장 <b>${num(t.media)}곳</b></span><span>설치 TV <b>${num(t.tv)}대</b></span></div>
    </div>`;
    }).join('\n    ');
    const t1 = R.tiers[0], t2 = R.tiers[1];
    const tvPctNum = parseFloat(R.tier12.tvPct);
    const reach = Math.abs(tvPctNum - 50) < 5 ? `절반(${esc(R.tier12.tvPct)}%)` : `${esc(R.tier12.tvPct)}%`;

    return `<div style="${PAGE} padding: 48px 64px 44px;">
  ${runHead(R, '04')}

  <div style="margin-top: 36px; font-size: 13px; font-weight: 700; color: #A4161A; letter-spacing: 0.1em;">03 · 제안</div>
  <h2 style="margin: 12px 0 0; ${SERIF} font-weight: 900; font-size: 32px; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance;">업장이 몰린 ${B} 매장부터<br>시작하는 3단계 타깃팅</h2>
  <p style="margin: 14px 0 0; font-size: 15px; line-height: 1.7; color: #3A3835; text-wrap: pretty;">${B} 매장마다 1km 안에 매칭된 ${M} 업장 수로 거점을 나눴습니다. 상위 두 단계인 ${B} ${num(R.tier12.stores)}개 매장(매칭 매장의 ${esc(R.tier12.storesPct)}%)으로 1km 내 설치 TV의 ${reach}에 닿습니다.</p>

  <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">

  </div>

  <div style="margin-top: 12px; display: flex; flex-direction: column; border-top: 2px solid #1C1B1A;">
    <div style="display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid #E6E3DE;">
      <span style="font-weight: 700; color: #A4161A;">1 · 파일럿</span>
      <span style="font-size: 14px; line-height: 1.6;">Tier 1 ${esc(t1.name)} ${num(t1.stores)}곳 상권에서 객실 TV ${num(t1.tv)}대에 ${B} 광고를 노출합니다. 기간과 단가는 [협의 후 기재]입니다.</span>
    </div>
    <div style="display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid #E6E3DE;">
      <span style="font-weight: 700; color: #A4161A;">2 · 측정</span>
      <span style="font-size: 14px; line-height: 1.6;">거점마다 전용 쿠폰이나 QR을 붙여, 노출이 실제 주문으로 이어졌는지 ${B} 매장 단위로 확인합니다.</span>
    </div>
    <div style="display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid #E6E3DE;">
      <span style="font-weight: 700; color: #A4161A;">3 · 확장</span>

    </div>

  </div>
  <div style="margin-top: 8px; display: flex; height: 56px;">
    ${T.map((t, i) => `<div style="width: ${esc(t.tvPct)}%; background: ${colors[i]}; color: ${text[i]}; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box; ${SG} font-size: 16px; font-weight: 500;">${esc(t.tvPct)}%</div>`).join('\n    ')}
  </div>

  <div style="margin-top: 20px; display: grid; grid-template-columns: ${T.map(t => `${Number(t.tvPct)}fr`).join(' ')}; gap: 0;">
    ${T.map((t, i) => `<div style="border-top: 3px solid ${colors[i]}; padding: ${pads[i]}; display: flex; flex-direction: column; gap: 6px;">
      <b style="font-size: 13px;">Tier ${i + 1} ${esc(short(t))}</b>
      <span style="font-size: 12px; color: ${MUTE};">업장 ${esc(t.range)}</span>
      <span style="${SG} font-size: 30px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.1;">${n(t.stores)}</span>
      <span style="font-size: 12px; line-height: 1.6;">${B} 매장<br>업장 ${n(t.media)}<br>TV ${n(t.tv)}</span>
    </div>`).join('\n    ')}
  </div>

  <div style="margin-top: 44px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;">
    <span style="font-size: 13px; font-weight: 900;">진행 제안</span>
    ${step('01 파일럿', `Tier 1 ${esc(T[0].name)} ${n(T[0].stores)}곳 상권, 객실 TV ${n(T[0].tv)}대에 노출. 기간·단가 [협의 후 기재]`)}

    ${step('03 확장', `성과 확인 후 Tier 2 ${esc(T[1].name)} ${n(T[1].stores)}곳(TV ${n(T[1].tv)}대)으로 확대`)}
  </div>

  <div style="margin-top: 40px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;">
    <span style="font-size: 13px; font-weight: 900;">산정 기준</span>
    <div style="grid-column: span 3; border-top: 1px solid ${INK}; padding-top: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 12px; line-height: 1.6; color: ${BODY};">
      <span>대상: 만료일이 기준일 이후인 ${M} 활성 매장(볼래TV·테스트 매장 제외)</span>
      <span>위치: ${B} 홈페이지 매장 좌표, ${M}는 카카오 주소 검색 좌표</span>
      <span>거리: 직선거리와 직선거리 × 1.35 도로계수로 환산한 도로거리, 교통정체 미반영</span>
      <span>배달 소요: 조리·포장 15분 + 픽업·전달 5분 + 이동시간(오토바이 20km/h 가정) 추정치</span>
    </div>
  </div>

    <span style="text-align: right; ${SG} color: ${BLUE};">${esc(R.brand.toUpperCase())} × ${esc(R.mediaEn)}</span>
  </div>`);

  };
})();

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Number(n).toLocaleString('ko-KR');
const km = m => m < 1000 ? Math.round(m) + 'm' : (m / 1000).toFixed(1) + 'km';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw) {
  const k0 = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.it, hash: 'SHA-256' }, k0, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct));
  return JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}
// 이 기기에서 한 번 열면 다시 묻지 않도록 비밀번호를 기억(같은 휴대폰 브라우저에만)
async function tryOpen(pw, remember) {
  const D = await decrypt(pw);
  if (remember) try { localStorage.setItem('adTeamPw', pw); } catch {}
  start(D);
}
$('lf').addEventListener('submit', async e => {
  e.preventDefault();
  try { await tryOpen($('pw').value.trim(), true); } catch { $('lerr').textContent = '비밀번호가 맞지 않습니다.'; $('lerr').hidden = false; }
});
(async () => { let pw = null; try { pw = localStorage.getItem('adTeamPw'); } catch {} if (pw) try { await tryOpen(pw, false); } catch { try { localStorage.removeItem('adTeamPw'); } catch {} } })();

let D, M, ci = 0, R, map, layer, mapReady = false, design = 'A';
const BANDS = ['같은 건물', '~100m', '~300m', '~500m', '~1km', '~2km', '~3km', '~5km', '5km+'];
function dist(a, b, c, d) { const x = (d - b) * Math.cos((a + c) * Math.PI / 360) * 111320, y = (c - a) * 110574; return Math.hypot(x, y); }
let grid;
function nearby(lat, lng, maxM) { const cy = Math.floor(lat / .05), cx = Math.floor(lng / .05), out = [];
  for (let y = cy - 2; y <= cy + 2; y++) for (let x = cx - 2; x <= cx + 2; x++) for (const i of grid.get(y + ',' + x) || []) { const d = dist(lat, lng, M[i][0], M[i][1]); if (d <= maxM) out.push({ i, d }); }
  return out.sort((a, b) => a.d - b.d); }

function start(data) {
  D = data; M = D.media;
  grid = new Map(); M.forEach((m, i) => { const k = Math.floor(m[0] / .05) + ',' + Math.floor(m[1] / .05); (grid.get(k) || grid.set(k, []).get(k)).push(i); });
  $('lock').remove(); $('app').classList.add('on');
  $('asof').textContent = `콘텐츠큐브 기준 ${D.asOf}`;
  $('client').innerHTML = D.clients.map((c, i) => `<option value="${i}">${esc(c.name)}</option>`).join('');
  $('client').onchange = e => { ci = +e.target.value; refresh(); };
  document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => show(b.dataset.v));
  refresh();
}
function show(v) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === v));
  if (v === 'vMap') { initMap(); setTimeout(() => map.invalidateSize(), 50); }
  if (v === 'vRep') renderRep();
}
function refresh() { R = computeReport(D.clients[ci], M, D.asOf); renderHome(); sel = null; if (mapReady) pickStore(topIdx()); if ($('vRep').classList.contains('on')) renderRep(); }

  layer = L.layerGroup().addTo(map); mapReady = true;
  $('q').addEventListener('input', e => {
    const q = e.target.value.trim(), B = D.clients[ci].stores, res = $('res');
    if (!q) { res.hidden = true; return; }
    const hits = B.map((s, i) => [s, i]).filter(([s]) => (s[2] + s[5]).includes(q)).slice(0, 30);
    res.innerHTML = hits.map(([s, i]) => `<div class="go" data-i="${i}"><b>${esc(s[2])}</b><br><small class="sub">${esc(s[5])}</small></div>`).join('') || '<div class="sub">검색 결과가 없습니다.</div>';
    res.hidden = false;
  });
  $('res').addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (!d) return; $('res').hidden = true; $('q').value = ''; $('q').blur(); pickStore(+d.dataset.i); });
  pickStore(sel ?? topIdx());
}
function pickStore(i) {
  sel = i; if (!mapReady) return;
  const s = D.clients[ci].stores[i], near = nearby(s[0], s[1], 3000);
  const ring = r => { const v = near.filter(x => x.d <= r); return [v.length, v.reduce((a, x) => a + M[x.i][10], 0)]; };
  const [a1, t1] = ring(500), [a2, t2] = ring(1000), [a3, t3] = ring(3000);
  layer.clearLayers();
  for (const r of [500, 1000, 3000]) L.circle([s[0], s[1]], { radius: r, color: '#1f4fd1', weight: r === 3000 ? 2 : 1, dashArray: r === 3000 ? null : '4 4', fill: r === 3000, fillOpacity: .04, interactive: false }).addTo(layer);
  near.forEach(x => { const m = M[x.i]; L.circleMarker([m[12], m[13]], { radius: 7, color: '#fff', weight: 1.5, fillColor: TYPE(m[3]), fillOpacity: .95 }).bindPopup(`<b>${esc(m[2])}</b> · ${esc(m[3])}<br>TV ${m[10]}대 · ${km(x.d)}`).addTo(layer); });
  L.marker([s[0], s[1]], { icon: L.divIcon({ className: '', html: '<div class="brandpin"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 1000 }).addTo(layer);
  map.fitBounds(L.latLng(s[0], s[1]).toBounds(3200));
  $('sheet').innerHTML = `<div class="grip"></div><b style="font-size:16px">${esc(s[2])}</b><div class="sub">${esc(s[5])}</div>
    <div class="chips"><span>500m ${a1}</span><span>1km ${a2}</span><span>3km ${a3}</span><span>1km TV ${fmt(t2)}</span></div>
    ${near.slice(0, 40).map(x => { const m = M[x.i]; return `<div class="row"><span><span class="dot" style="background:${TYPE(m[3])}"></span><span class="num">${esc(m[2])}</span> <small>${esc(m[3])} · TV ${m[10]}</small></span><span class="r num">${km(x.d)}</span></div>`; }).join('')}
    <div class="foot">업소는 번호로, 위치는 100~200m 흐리게 표시합니다.</div>`;
}

function renderRep() {
  const keys = Object.keys(window.REPORT_DESIGNS);
  if (!keys.includes(design)) design = keys[0];
  const mod = REPORT_DESIGNS[design];
  (mod.fonts || []).forEach(f => { if (!document.querySelector(`link[href="${f}"]`)) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = f; document.head.appendChild(l); } });
  const w = Math.min(document.documentElement.clientWidth, 820) - 28, s = w / 794;
  $('vRep').innerHTML = `<div class="pad"><div class="designs">${keys.map(k => `<button data-d="${k}" aria-pressed="${k === design}">${k}</button>`).join('')}<span class="sub" style="align-self:center">${esc(mod.name)}</span></div>
    ${mod.pages.map(p => `<div class="pgwrap" style="width:${794 * s}px;height:${1123 * s}px"><div class="pg" style="transform:scale(${s})">${p(R)}</div></div>`).join('')}
    <div class="foot">광고주에게는 PC 앱의 [광고주 링크 발급]으로 보내 주세요.</div></div>`;
  $('vRep').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { design = b.dataset.d; renderRep(); });
}
addEventListener('resize', () => { if ($('vRep').classList.contains('on')) renderRep(); });
</script>
