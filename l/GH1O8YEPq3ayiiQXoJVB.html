<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>보호된 문서</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* 광고주에게 보내는 링크: 비밀번호로 풀어야 열림 · 업소 상호 없음(코드) · 모든 화면에 발급 표시 */
:root{--bg:#f1f3f6;--panel:#fff;--line:#e1e4e9;--fg:#1b2230;--muted:#667085;--accent:#1f4fd1;--accent-soft:#e8eefc;--bar:#1c2c52;
  --hotel:#0f7b8a;--comic:#d4880f;--etc:#7a8394;--brand:#c8102e;--f:'IBM Plex Sans KR','Malgun Gothic',sans-serif;--m:'IBM Plex Mono',Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f)}
button,input{font:inherit;color:inherit}
.num{font-family:var(--m);font-variant-numeric:tabular-nums}
#lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#lock form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
#lock h1{margin:0;font-size:18px}
#lock p{margin:0;color:var(--muted);font-size:13px}
#lock input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px;letter-spacing:.08em}
#lock button{padding:10px;border:0;border-radius:8px;background:var(--bar);color:#fff;font-weight:600;cursor:pointer}
#lock .err{color:#b42318;font-size:13px}
#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}
header{background:var(--bar);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 16px}
header h1{margin:0;font-size:16px}
header nav{display:flex;gap:6px}
header nav button{border:0;border-radius:7px;padding:6px 14px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;cursor:pointer}
header nav button[aria-pressed="true"]{background:#fff;color:var(--bar)}
header .stamp{margin-left:auto;font-size:12px;color:#c9d3ea;text-align:right}
#mapView{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr;gap:14px;padding:14px 16px}
#side{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
#side>*{flex-shrink:0}
#mapBox{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:0}
#map{position:absolute;inset:0}
#side input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list button{display:grid;grid-template-columns:1fr auto;gap:0 8px;text-align:left;border:0;border-top:1px solid var(--line);background:var(--panel);padding:8px 10px;cursor:pointer}
.list button:first-child{border-top:0}
.list button:hover,.list button.on{background:var(--accent-soft)}
.list .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .n{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-size:11px;color:var(--muted)}
.list .n b{display:block;font-size:16px;color:var(--fg)}
h2{margin:0;font-size:17px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rings div{padding:8px 10px;border-left:1px solid var(--line)}
.rings div:first-child{border-left:0}
.rings span{display:block;font-size:11px;color:var(--muted)}
.rings b{font-size:20px;font-family:var(--m)}
.rings small{display:block;font-size:11px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 6px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
.note{font-size:11px;color:var(--muted);line-height:1.5}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
#reportView{flex:1;overflow:auto;padding:20px 16px;display:none;flex-direction:column;align-items:center;gap:20px}
#reportView.on{display:flex}
.pgwrap{overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.18);flex-shrink:0}
.pg{width:794px;height:1123px;transform-origin:top left;background:#fff}
#wm{position:fixed;inset:0;pointer-events:none;z-index:5000;opacity:.07}
.brandpin{width:16px;height:16px;background:var(--brand);border:3px solid #fff;transform:rotate(45deg);box-shadow:0 1px 4px rgba(0,0,0,.4)}
@media (max-width:820px){#mapView{grid-template-columns:1fr;grid-template-rows:50vh auto}#mapBox{order:-1}header .stamp{margin-left:0;text-align:left}}
@media print{body{display:none}}
</style>
</head>
<body>
<div id="lock">
  <form id="lf" autocomplete="off">
    <h1>보호된 문서</h1>
    <p>전달받으신 열람 비밀번호를 넣어 주세요.</p>
    <input id="pw" type="password" aria-label="열람 비밀번호" autofocus>
    <p class="err" id="lerr" hidden></p>
    <button type="submit">열기</button>
  </form>
</div>
<div id="app">
  <header>
    <h1 id="ttl"></h1>
    <nav><button type="button" data-v="map" aria-pressed="true">매장별 찾아보기</button><button type="button" data-v="report" aria-pressed="false">리포트</button></nav>
    <div class="stamp" id="stamp"></div>
  </header>
  <div id="mapView"><aside id="side"></aside><div id="mapBox"><div id="map"></div></div></div>
  <div id="reportView"></div>
</div>
<div id="wm" hidden></div>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Number(n).toLocaleString('ko-KR');
const km = m => m < 1000 ? m + 'm' : (m / 1000).toFixed(1) + 'km';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw) {
  const km_ = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.it, hash: 'SHA-256' }, km_, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct));
  const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}

$('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const err = $('lerr');
  try { start(await decrypt($('pw').value.trim())); }
  catch { err.textContent = '비밀번호가 맞지 않습니다.'; err.hidden = false; $('pw').select(); }
});

function start(P) {
  if (Date.now() > new Date(P.expires).getTime()) {
    $('lf').innerHTML = '<h1>열람 기간이 끝났습니다</h1><p>이 문서는 ' + esc(P.expires.slice(0, 10)) + '까지 볼 수 있었습니다. 담당자에게 새 링크를 요청해 주세요.</p>';
    return;
  }
  $('lock').remove(); $('app').classList.add('on');
  document.title = `${P.client} 배달 상권 분석`;
  $('ttl').textContent = `${P.client} × ${P.media} 배달 상권 분석`;
  $('stamp').innerHTML = `${esc(P.client)} 전용 · 문서번호 <b>${esc(P.docNo)}</b><br>받는 분 ${esc(P.recipient)}${P.recipientOrg ? ' (' + esc(P.recipientOrg) + ')' : ''} · 발급 ${esc(P.issuer)} · ${esc(P.expires.slice(0, 10))}까지`;
  // 모든 화면에 옅은 발급 표시
  const t = `${P.client} 전용 · ${P.docNo} · ${P.recipient}`;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='420' height='220'><text x='10' y='120' transform='rotate(-22 210 110)' font-family='sans-serif' font-size='15' fill='#000'>${t.replace(/[<&]/g, '')}</text></svg>`;
  $('wm').style.background = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`; $('wm').hidden = false;
  P.fonts.forEach(f => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = f; document.head.appendChild(l); });
  $('reportView').innerHTML = P.pages.map(h => `<div class="pgwrap"><div class="pg">${h}</div></div>`).join('');
  document.querySelectorAll('header nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('header nav button').forEach(x => x.setAttribute('aria-pressed', x === b));
    const rep = b.dataset.v === 'report';
    $('mapView').style.display = rep ? 'none' : ''; $('reportView').classList.toggle('on', rep);
    if (rep) fitPages(); else map.invalidateSize();
  });
  addEventListener('resize', fitPages);
  initMap(P);
}
function fitPages() {
  const w = $('reportView').clientWidth - 32, s = Math.min(1, w / 794);
  document.querySelectorAll('.pgwrap').forEach(p => { p.style.width = 794 * s + 'px'; p.style.height = 1123 * s + 'px'; p.firstElementChild.style.transform = `scale(${s})`; });
}

let map, layer;
const TYPE = { H: ['호텔', 'var(--hotel)', '#0f7b8a'], C: ['만화카페', 'var(--comic)', '#d4880f'], E: ['기타', 'var(--etc)', '#7a8394'] };
function initMap(P) {
  // P.stores: [lat,lng,매장명,주소,[[업소번호,거리m],...]] · P.venues: [lat,lng,유형,TV,코드] (위치는 약간 흐림)
  map = L.map('map', { preferCanvas: true }).setView([36.4, 127.8], 7);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(map);
  layer = L.layerGroup().addTo(map);
  const order = [...P.stores.keys()].sort((a, b) => P.stores[b][4].filter(x => x[1] <= 1000).length - P.stores[a][4].filter(x => x[1] <= 1000).length);
  let q = '', sel = order[0];
  const side = $('side');
  function list() {
    const ids = order.filter(i => !q || (P.stores[i][2] + P.stores[i][3]).includes(q)).slice(0, 60);
    return ids.map(i => { const s = P.stores[i], n1 = s[4].filter(x => x[1] <= 1000).length;
      return `<button data-i="${i}" class="${i === sel ? 'on' : ''}"><span class="t">${esc(s[2])}</span><span class="s">${esc(s[3])}</span><span class="n"><b class="num">${n1}</b>1km 내</span></button>`; }).join('') || '<p class="note">검색 결과가 없습니다.</p>';
  }
  function render() {
    const s = P.stores[sel], near = s[4];
    const ring = r => { const v = near.filter(x => x[1] <= r); return [v.length, v.reduce((a, x) => a + P.venues[x[0]][3], 0)]; };
    const [a1, t1] = ring(500), [a2, t2] = ring(1000), [a3, t3] = ring(3000);
    side.innerHTML = `<input id="q" type="search" placeholder="${esc(P.client)} 매장명·주소 검색" value="${esc(q)}">
      <div><h2>${esc(s[2])}</h2><div class="note">${esc(s[3])}</div></div>
      <div class="rings"><div><span>500m 이내</span><b>${a1}</b><small>TV ${fmt(t1)}대</small></div><div><span>1km 이내</span><b>${a2}</b><small>TV ${fmt(t2)}대</small></div><div><span>3km 이내</span><b>${a3}</b><small>TV ${fmt(t3)}대</small></div></div>
      ${near.length ? `<div style="overflow-x:auto"><table><thead><tr><th>업소</th><th>유형</th><th class="r">TV</th><th class="r">거리</th></tr></thead><tbody>
        ${near.filter(x => x[1] <= 3000).map(x => { const v = P.venues[x[0]]; return `<tr><td class="num">${esc(v[4])}</td><td><span class="dot" style="background:${TYPE[v[2]][1]}"></span>${TYPE[v[2]][0]}</td><td class="r num">${v[3]}</td><td class="r num">${km(x[1])}</td></tr>`; }).join('')}
      </tbody></table></div>` : ''}
      <p class="note">${esc(P.media)} 업소는 상호 대신 번호로 표시하며, 지도 위치는 100~200m 범위에서 흐리게 표시했습니다. 거리와 TV 수는 실제 값입니다. 기준 ${esc(P.asOf)}.</p>
      <div class="label">${esc(P.client)} 매장 (1km 내 업소가 많은 순)</div><div class="list">${list()}</div>`;
    $('q').addEventListener('input', e => { q = e.target.value; side.querySelector('.list').innerHTML = list(); });
    layer.clearLayers();
    for (const r of [500, 1000, 3000]) L.circle([s[0], s[1]], { radius: r, color: '#1f4fd1', weight: r === 3000 ? 2 : 1, dashArray: r === 3000 ? null : '4 4', fill: r === 3000, fillOpacity: .04, interactive: false }).addTo(layer);
    near.filter(x => x[1] <= 3000).forEach(x => { const v = P.venues[x[0]];
      L.circleMarker([v[0], v[1]], { radius: 6, color: '#fff', weight: 1.5, fillColor: TYPE[v[2]][2], fillOpacity: .95 })
        .bindPopup(`<b>${esc(v[4])}</b> · ${TYPE[v[2]][0]}<br>TV ${v[3]}대 · 매장에서 ${km(x[1])}`).addTo(layer); });
    L.marker([s[0], s[1]], { icon: L.divIcon({ className: '', html: '<div class="brandpin"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 1000 }).bindPopup(esc(s[2])).addTo(layer);
    map.fitBounds(L.latLng(s[0], s[1]).toBounds(6600));
  }
  side.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { sel = +b.dataset.i; render(); side.scrollTop = 0; } });
  render();
}
</script>
